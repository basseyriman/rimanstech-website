<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="RimansTech RT monogram">
  <title>RimansTech RT Monogram</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161718"/>
      <stop offset="100%" stop-color="#0a0b0b"/>
    </linearGradient>
    <linearGradient id="metal" x1="96" y1="72" x2="416" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafa"/>
      <stop offset="8%" stop-color="#dfe3e7"/>
      <stop offset="22%" stop-color="#f2f4f6"/>
      <stop offset="42%" stop-color="#8e949a"/>
      <stop offset="58%" stop-color="#c5c9ce"/>
      <stop offset="78%" stop-color="#e4e7ea"/>
      <stop offset="100%" stop-color="#969ca2"/>
    </linearGradient>
    <linearGradient id="shade" x1="200" y1="260" x2="340" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="shine" x1="108" y1="128" x2="404" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.58"/>
    </filter>
    <clipPath id="icon">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#icon)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- Shadow -->
    <g transform="translate(0, 12)" opacity="0.42" fill="#000">
      <path d="M108 128 H404 V188 H108 V128 Z"/>
      <path d="M108 188 V128 H252 C320 128 328 256 260 264 L216 272 L312 392 H360 V376 H308 L212 272 C164 272 108 228 108 188 Z"/>
      <path d="M312 188 H364 V392 H312 V188 Z"/>
    </g>

    <g filter="url(#shadow)">
      <!-- RT shared top bar -->
      <path d="M108 128 H404 V188 H108 V128 Z" fill="url(#metal)"/>

      <!-- R: smooth loop, sharp fold, diagonal leg, flat foot -->
      <path
        d="M108 188
           V128
           H252
           C320 128 328 256 260 264
           L216 272
           L312 392
           H360
           V376
           H308
           L212 272
           C164 272 108 228 108 188
           Z"
        fill="url(#metal)"
      />

      <!-- T stem -->
      <path d="M312 188 H364 V392 H312 V188 Z" fill="url(#metal)"/>

      <!-- Fold shadow -->
      <path d="M216 272 L260 264 C328 256 320 128 252 128 H252 H108 V188 C108 228 164 272 212 272 Z" fill="url(#shade)"/>
      <path d="M212 272 L308 376 H292 L216 284 Z" fill="#000" opacity="0.2"/>

      <!-- Top edge highlight -->
      <path d="M108 128 H404 V152 H108 V128 Z" fill="url(#shine)"/>
    </g>
  </g>
</svg>
